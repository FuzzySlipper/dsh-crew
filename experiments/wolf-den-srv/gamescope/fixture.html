<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wolf pointer fixture</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #10151d; color: #eef4ff; }
    #controls { position: fixed; top: 32px; right: 40px; width: 320px; padding: 20px; border: 1px solid #52657c; border-radius: 12px; background: #18222f; }
    #lock { width: 100%; min-height: 54px; font: inherit; font-weight: 700; background: #80caff; color: #06121c; border: 0; border-radius: 8px; cursor: pointer; }
    #status { margin: 16px 0 0; font-family: ui-monospace, monospace; white-space: pre-wrap; line-height: 1.45; }
    #target-grid { position: fixed; top: 18vh; left: 10vw; display: grid; grid-template-columns: repeat(3, 144px); grid-template-rows: repeat(3, 108px); gap: 28px; }
    .target { border: 4px solid #d8ecff; border-radius: 14px; background: #245a81; color: #fff; font: 700 42px/1 system-ui, sans-serif; cursor: pointer; }
    .target:active { background: #f7bc4b; color: #1b1300; }
    #hint { position: fixed; left: 10vw; bottom: 10vh; font-size: 18px; color: #bdd0e4; }
  </style>
</head>
<body>
  <section id="target-grid" aria-label="Pointer targets">
    <button class="target" data-target="A">A</button><button class="target" data-target="B">B</button><button class="target" data-target="C">C</button>
    <button class="target" data-target="D">D</button><button class="target" data-target="E">E</button><button class="target" data-target="F">F</button>
    <button class="target" data-target="G">G</button><button class="target" data-target="H">H</button><button class="target" data-target="I">I</button>
  </section>
  <aside id="controls">
    <button id="lock" type="button">Lock pointer</button>
    <div id="status" aria-live="polite"></div>
  </aside>
  <p id="hint">Click targets A–I. Press <strong>L</strong> to request pointer lock from a trusted key event if a click is unavailable.</p>
  <script>
    (() => {
      const status = document.querySelector('#status');
      const lockButton = document.querySelector('#lock');
      const grid = document.querySelector('#target-grid');
      const pending = [];
      const movement = { count: 0, dx: 0, dy: 0, totalDx: 0, totalDy: 0, lastDx: 0, lastDy: 0, trusted: true };
      let flushTimer = null;
      let lastEvent = 'waiting for native input';

      function locked() { return document.pointerLockElement === document.body; }
      function render() {
        status.textContent = [
          `lock: ${locked() ? 'locked' : 'unlocked'}`,
          `last event: ${lastEvent}`,
          `movement: last ${movement.lastDx},${movement.lastDy} | batch ${movement.dx},${movement.dy} (${movement.count}) | total ${movement.totalDx},${movement.totalDy}`
        ].join('\n');
      }
      function record(event, immediate = false) {
        pending.push({ at: new Date().toISOString(), ...event });
        lastEvent = event.type;
        render();
        if (immediate) flush();
        else if (flushTimer === null) flushTimer = window.setTimeout(flush, 250);
      }
      function flushMovement() {
        if (!movement.count) return;
        record({ type: 'mouse-movement', trusted: movement.trusted, locked: locked(), dx: movement.dx, dy: movement.dy, count: movement.count, total_dx: movement.totalDx, total_dy: movement.totalDy });
        movement.count = 0;
        movement.dx = 0;
        movement.dy = 0;
		movement.trusted = true;
      }
      function flush() {
        if (flushTimer !== null) { window.clearTimeout(flushTimer); flushTimer = null; }
        flushMovement();
        if (!pending.length) return;
        const events = pending.splice(0, pending.length);
        fetch('/events', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ events }), keepalive: true })
          .catch(error => { lastEvent = `post failed: ${error.message}`; render(); });
      }
      function requestLock(trigger, sourceEvent) {
        record({ type: 'pointer-lock-request', trigger, trusted: sourceEvent.isTrusted, locked: locked() }, true);
        try {
          const request = document.body.requestPointerLock();
          if (request && typeof request.catch === 'function') request.catch(error => record({ type: 'pointer-lock-request-failed', trigger, message: error.message }, true));
        } catch (error) {
          record({ type: 'pointer-lock-request-failed', trigger, message: error.message }, true);
        }
      }

      grid.addEventListener('click', event => {
        const target = event.target.closest('[data-target]');
        if (!target) return;
        record({ type: 'target-click', trusted: event.isTrusted, target: target.dataset.target, client_x: event.clientX, client_y: event.clientY, page_x: event.pageX, page_y: event.pageY, locked: locked() }, true);
      });
      lockButton.addEventListener('click', event => requestLock('button-click', event));
      document.addEventListener('keydown', event => {
        record({ type: 'key-down', key: event.key, code: event.code, trusted: event.isTrusted }, true);
		if (event.key.toLowerCase() !== 'l' || event.repeat) return;
		if (event.isTrusted) requestLock('keydown-l', event);
		else record({ type: 'pointer-lock-key-ignored', trigger: 'keydown-l', trusted: false }, true);
      });
      document.addEventListener('mousemove', event => {
        pending.push({ at: new Date().toISOString(), type: 'mouse-sample', trusted: event.isTrusted, locked: locked(), dx: event.movementX, dy: event.movementY, client_x: event.clientX, client_y: event.clientY });
        movement.count += 1;
        movement.dx += event.movementX;
        movement.dy += event.movementY;
        movement.totalDx += event.movementX;
        movement.totalDy += event.movementY;
        movement.lastDx = event.movementX;
        movement.lastDy = event.movementY;
		movement.trusted = movement.count === 1 ? event.isTrusted : movement.trusted && event.isTrusted;
        lastEvent = 'mouse-movement';
        render();
        if (flushTimer === null) flushTimer = window.setTimeout(flush, 250);
      });
      document.addEventListener('pointerlockchange', () => record({ type: 'pointer-lock-change', locked: locked() }, true));
      document.addEventListener('pointerlockerror', () => record({ type: 'pointer-lock-error', locked: locked() }, true));
      window.addEventListener('pagehide', flush);
      window.addEventListener('resize', () => record({ type: 'viewport', width: innerWidth, height: innerHeight }, true));
      window.addEventListener('focus', () => record({ type: 'focus', focused: document.hasFocus() }, true));
      window.addEventListener('blur', () => record({ type: 'focus', focused: document.hasFocus() }, true));
      record({ type: 'viewport', width: innerWidth, height: innerHeight }, true);
      render();
    })();
  </script>
</body>
</html>
